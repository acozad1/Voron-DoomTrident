[include mainsail.cfg]
[include mainsail.cfg]
[include rainbow_barf.cfg]
[include gcode_macro.cfg]
[gcode_arcs]
[exclude_object]
[include K-ShakeTune/*.cfg]
[include KAMP_Settings.cfg]
[include bed_fans.cfg]
[include motors_sync.cfg]




[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000

#####################################################################
# MCU SETUP Manta M8P
#####################################################################
[mcu]
canbus_uuid: 8ae617e38648 #Manta M8P

[mcu cartographer]
canbus_uuid: ff94798a3c6b #Cartogrpher V4

[mcu H36_combo]
canbus_uuid: 05eb09707946 #Fystec H36 V1.2

[mcu rpi]
serial: /tmp/klipper_host_mcu

#####################################################################
# KLIPPER SCREEN
#####################################################################
[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[gcode_macro HELLO_WORLD]
gcode:
    RESPOND MSG="Hello World!"

#####################################################################
# PRINTER DEFINITIONS
#####################################################################

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 30000
minimum_cruise_ratio: 0.0
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 15
minimum_cruise_ratio: 0.5     # Ensures Klipper spends time cruising instead of instantly decelerating

[firmware_retraction]
retract_length: 0.6
retract_speed: 85 
unretract_speed: 80

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 3
#keep_raw_csv: False
show_macros_in_webui: True
timeout: 300

[force_move]
enable_force_move: True

#####################################################################
# Cartographer Probe V4
#####################################################################
[cartographer]
mcu: cartographer
x_offset: 17 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output

[safe_z_home]
home_xy_position: 150, 150    # Center of your bed (X, Y)
speed: 100
z_hop: 10                     # Lifts Z before XY homing to prevent nozzle scraping
z_hop_speed: 15

#################################################################################
# BED MESH
#################################################################################

[bed_mesh]
zero_reference_position: 150, 150
speed: 300
horizontal_move_z: 10
mesh_min: 35,26
mesh_pps: 1,1
mesh_max: 270, 258
probe_count: 15,15
algorithm: bicubic

[input_shaper]
##  A frequency (in Hz) of the input shaper for X or Y axis. 
shaper_type_x: mzv
shaper_freq_x: 100.4
shaper_type_y: mzv
shaper_freq_y: 69.4
#damping_ratio_x: 0.044
#damping_ratio_y: 0.044

[adxl345]
# Keep ONE cs_pin line for your probe version.
cs_pin: cartographer:PA0  # Cartographer V4 - use this line instead of the one above
spi_bus: spi1

#[adxl345] # Fystec H36_combo
#cs_pin: H36_combo:PB12
#spi_software_sclk_pin: H36_combo:PB10
#spi_software_mosi_pin: H36_combo:PB11
#spi_software_miso_pin: H36_combo:PB2
#axes_map: -y,z,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    150, 150, 20
    
[idle_timeout]
timeout: 1800

#####################################################################
# X/Y STEPPER SETTINGS
#####################################################################

## X Stepper on Motor2 (Rear Left Motor)
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 32
rotation_distance: 40  
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100  #Max 100
homing_retract_dist: 10
# Activates Kalico high-precision step calculations for X
high_precision_step_compress: True
#step_pulse_duration: 0.000001

[tmc5160 stepper_x]
cs_pin: PC13
spi_speed: 4000000
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
diag1_pin: ^!PF4 # diag1 tmc5160
interpolate: False
run_current: 1.8
hold_current: 0.7
sense_resistor: 0.075
stealthchop_threshold: 0
driver_SGT: 0

[stepper_x1] # (Front Right Motor)
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 32
rotation_distance: 40 
endstop_pin: tmc5160_stepper_x:virtual_endstop
# Activates Kalico high-precision step calculations for X
high_precision_step_compress: True
#step_pulse_duration: 0.000001

[tmc5160 stepper_x1]
cs_pin: PE3
spi_speed: 4000000
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
diag1_pin: ^!PF3 # diag1 tmc5160
interpolate: False
run_current: 1.8
hold_current: 0.7
sense_resistor: 0.075
stealthchop_threshold: 0
driver_SGT: 0

## Y Stepper on Motor1 (B Motor)
[stepper_y] # (Rear Right Motor)
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 32
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100 # Max 100  
homing_retract_dist: 10
# Activates Kalico high-precision step calculations for X
high_precision_step_compress: True
#step_pulse_duration: 0.000001

[tmc5160 stepper_y] 
cs_pin: PB9
spi_speed: 4000000
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
diag1_pin: ^!PF2 # diag1 tmc5160
interpolate: False
run_current: 1.8
hold_current: 0.7
sense_resistor: 0.075
stealthchop_threshold: 0
driver_SGT: 0

[stepper_y1] # (Left Front Motor)
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
microsteps: 32
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
# Activates Kalico high-precision step calculations for X
high_precision_step_compress: True
#step_pulse_duration: 0.000001

[tmc5160 stepper_y1]
cs_pin: PB5
spi_speed: 4000000
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
diag0_pin: ^!PF1 # diag1 tmc5160
interpolate: False
run_current: 1.8
hold_current: 0.7
sense_resistor: 0.075
stealthchop_threshold: 0
driver_SGT: 0

#####################################################################
# Z STEPPER SETTINGS
#####################################################################

[stepper_z] # Front Left Lead Screw
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
rotation_distance: 8 
microsteps: 16
endstop_pin: probe:z_virtual_endstop # uses carto as virtual endstop
position_max: 220
position_min: -8 # -2.5
homing_speed: 10.0
second_homing_speed: 3
homing_retract_dist: 0 # carto needs this to be set to 0

[tmc2209 stepper_z]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1] # center lead screw
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
rotation_distance: 8
microsteps: 16

[tmc2209 stepper_z1] 
uart_pin: PD5
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2] # front right lead screw
step_pin: PC7
dir_pin: PC8
enable_pin: !PD2
rotation_distance: 8
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PC6
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# EXTRUDER
#####################################################################
[extruder]
step_pin: H36_combo: PB9 
dir_pin: H36_combo: PB8
enable_pin: !H36_combo: PB7
rotation_distance: 28.94203233306  #Sherpa Micro  #BMG Gears 21.17762  # SBG2 45.6094368 # stock 47.088
gear_ratio: 50:8   #BMG Gears 50:10 10t motor
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
pressure_advance: 0.032
pressure_advance_smooth_time: 0.02
max_extrude_only_distance: 500.0
max_extrude_cross_section: 10
heater_pin: H36_combo: PA7
sensor_type: PT1000
sensor_pin: H36_combo: PA6
pullup_resistor: 2200
control: watermark
min_temp: -20
max_temp: 360
max_power: 1.0
min_extrude_temp: 150
max_extrude_cross_section: 5000.0

#[verify_heater extruder]
#max_error: 240
#check_gain_time: 80
#hysteresis: 5
#heating_gain: 2

[tmc2209 extruder]
uart_pin: H36_combo: PC14
interpolate: false
run_current: 0.60
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# Z TILT
#####################################################################

[z_tilt]
z_positions:
    -50, 18
    150, 348
    350, 18
points:
    30, 5
    150, 240
    270, 5
speed: 350
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075 

#####################################################################
# BED HEATER
#####################################################################

[heater_bed]
heater_pin: PF5 #HE0 connect
sensor_pin: PB1 # TB
sensor_type: Generic 3950 
max_power: 1
control: watermark
min_temp: 0
max_temp: 115

#####################################################################
# THERMISTOR SETTINGS
#####################################################################

[temperature_sensor CM5_MCU]
sensor_type: temperature_host
min_temp: -10
max_temp: 60

[temperature_sensor Manta_M8P_MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: -10
max_temp: 80

[temperature_sensor chamber_temperature]
sensor_type: Generic 3950
sensor_pin: PB0
#min_temp: 0
#max_temp: 100
#gcode_id: C

[temperature_sensor H36_combo_MCU]
sensor_type: temperature_mcu
sensor_mcu: H36_combo
min_temp: -10
max_temp: 100

[temperature_sensor DriverH36_Temp]
sensor_type: Generic 3950
sensor_pin: H36_combo: PA3
min_temp:0
max_temp:150

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105
#####################################################################
# FAN CONTROL
#####################################################################

[duplicate_pin_override]
pins: PB0

[heater_fan hotend_fan] # Hotend Fan
pin: H36_combo:PA9
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.5
hardware_pwm: false
kick_start_time: 0.10
tachometer_pin: H36_combo:PC6
heater: extruder
heater_temp: 55.0
shutdown_speed: 1.0

[multi_pin Part_Cooling]
pins: H36_combo:PB13, H36_combo:PA5

[fan]
pin: multi_pin: Part_Cooling # Part Cooling Fan
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.01  #0.05 to allow responsive state tracking
hardware_pwm: false
kick_start_time: 0.10

[heater_fan basement_fans] #basement fans (noctoa)
pin: PF6
#tachometer_pin: PC2
cycle_time: 0.010
shutdown_speed: 0
kick_start_time: 0.5             # start-up time (Please do not change)
heater: heater_bed               # Related equipment: heater_bed
heater_temp: 50                  # How many degrees does the heat bed reach to activate the fan
fan_speed: 0.90                  # Fan speed

[controller_fan stepper_fans]    # Driver cooling fan
pin: PF8                         # Fan pin 
cycle_time: 0.00003              # Cycle time
max_power: 1.0                   # Maximum power
shutdown_speed: 0.0              # Shutdown speed
fan_speed: 1.0                   # Fan speed when heater or stepper driver is active (0.0 to 1.0). Default is 1.0.
idle_timeout: 180                # Time in seconds to keep the fan running after the stepper driver or heater is no longer active. Default is 180 seconds 3 minutes.
idle_speed: 0.5                  # Fan speed after the stepper driver is no longer active and before idle_timeout is reached (0.0 to 1.0). Default is fan_speed.
stepper: stepper_x               # Active motors

[temperature_fan cm5_mcu_fan]
pin: PA6
tachometer_pin: PC2
cycle_time: 0.0001
hardware_pwm: false 
max_power: .8
max_speed: .9
min_speed: 0
shutdown_speed: 0
sensor_type: temperature_host
min_temp: -10
max_temp: 90
control: pid
pid_Kp: 4.0
pid_Ki: 1
pid_Kd: 0.2
pid_deriv_time: 2.0
target_temp: 60.0
max_speed: 1.0
min_speed: 0.0


#######################################################################
## Nevermore V6
#######################################################################
[output_pin nevermore]
pin: PF9
value: 0
shutdown_value: 0

